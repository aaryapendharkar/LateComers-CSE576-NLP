name: tests
on:
  push:
    branches: [main, "p*-**"]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements-core.txt
      - run: pytest -rs
