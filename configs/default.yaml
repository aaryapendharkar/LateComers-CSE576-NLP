# Shared configuration. Committed.
# RULE: edit only YOUR section (marked with the owner). Machine-specific changes
# (GPU, local model paths, smaller models) go in configs/local.yaml (gitignored).
# See configs/local.example.yaml.

seed: 576

# ---------------------------------------------------------------- Person 1
paths:
  raw_dir: data/raw
  docs: data/docs.jsonl                    # Person 1
  examples: data/examples.jsonl            # Person 1
  chart_docs: data/chart_docs.jsonl        # Person 4
  chart_examples: data/chart_examples.jsonl  # Person 4
  qtypes: data/labels/qtypes.jsonl         # Person 3
  pages_dir: data/pages                    # rendered PDFs/PNGs (gitignored)
  manifests_dir: data/manifests            # pages_<producer>.jsonl
  attacks_dir: data/attacks                # g1.jsonl (Person 2), g2.jsonl (Person 4)
  parsed_dir: data/parsed                  # Docling / pdfplumber output per page (gitignored)
  indexes_dir: data/indexes                # embeddings (gitignored)
  runs_dir: results/runs
  baselines_dir: results/baselines
  r2_correct: results/r2_correct.json

data:
  finqa:
    hf_dataset: G4KMU/t2-ragbench
    hf_config: FinQA                       # verified Nov 12 with --inspect (splits: train/dev/test)
    split: test
    n_docs: 500
    n_questions: 200
    # Our names -> T2-RAGBench column names (verified Nov 12 with --inspect).
    fields:
      id: id                               # "finqa_test_0" = row 0 of original FinQA test.json
      question: question                   # context-independent rewrite (company + year added)
      answer: program_answer               # "94.0" (original_answer = "94")
      context: context
      pre_text: pre_text
      post_text: post_text
      table: table                         # markdown, with a pandas index column we drop
      doc_key: file_name                   # "pdf/ETR/2016/page_23.pdf" (leading "pdf/" is stripped)
      program: null                        # not in T2-RAGBench -> join to original FinQA (--finqa-json)
  chartqa:
    n_questions: 100
    n_corpus: 300

pipelines:
  top_k_retrieve: 20
  top_k_final: 5
  rrf_k: 60
  # backend: "real" loads the models below; "mock" uses a tiny keyword retriever
  # and a fake generator so anyone can run the whole flow on a laptop/CI.
  backend: real
  # Where P1 gets page text: "standin" (docs.jsonl, Day 1), "docling", or "pdfplumber"
  p1_text_source: standin

models:
  embedder: BAAI/bge-m3
  colpali: vidore/colpali-v1.3             # verified Nov 12 (latest ColPali checkpoint)
  reranker: null                           # Qwen/Qwen3-VL-Reranker-2B exists, but OFF for the Nov 15 report (allowed by the brief)
  generator: Qwen/Qwen3.5-9B               # verified Nov 12: natively multimodal, thinking switched off in code
  generator_fallback: null                 # set in configs/local.yaml. Colab T4: Qwen/Qwen3-VL-4B-Instruct (Qwen3.5 needs
                                           # flash-linear-attention kernels; without them ~5 min/question on a T4). Record it!
  device: cuda
  dtype: bfloat16
  batch_size: 8

generation:
  prompt_file: configs/prompts/generator_v1.txt
  closed_book_prompt_file: configs/prompts/closed_book_v1.txt
  max_new_tokens: 128                      # answer is a short JSON (thinking is off)
  max_page_chars: 4000                     # per page (median page ~3,900); tables are never cut, only surrounding prose
  max_image_pixels: 600000                 # page images downscaled to fit GPU memory (~600 visual tokens)
  do_sample: false                         # greedy decoding

metrics:
  rel_tol: 0.01
  bootstrap_resamples: 1000
  ci: 0.95

# ---------------------------------------------------------------- Person 4
render:
  dpi: 150
  page_size: letter
  font: Times-Roman
  font_size: 10.5
  margin_pt: 54

# ---------------------------------------------------------------- Person 2
attacks_g1:
  min_rel_change: 0.05
  max_rel_change: 0.25
  min_target_diff: 0.05                    # keep edits whose target differs from gold by >5%
  n_per_type: 50
  program_reproduce_tol: 0.01

# ---------------------------------------------------------------- Person 4
attacks_g2:
  n_table_questions: 50
  n_charts: 50

# ---------------------------------------------------------------- Person 3
# D1 0.2.0 (docs/person3/D1_DESIGN.md). Tolerance is not a setting: a total may
# differ from its components by at most the sum of their printed half-units.
# Totals are found from labels (total/subtotal); "net" rows are differences and
# are reported as not checked. Unknown keys here raise an error.
reconcile:
  check_arithmetic: true
  check_prose: true
  dash_as_zero: false                      # dashes are MISSING unless this is on (must be reported)

# ---------------------------------------------------------------- Person 5
img_text_check:
  rel_tol: 0.01
  only_question_rows: false                # cheaper mode: compare rows named in the question
